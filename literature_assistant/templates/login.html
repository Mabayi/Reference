<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · Reference System</title>
    <link rel="stylesheet" href="/static/css/main.css?v=20260610h">
</head>
<body class="auth-page">
    <div class="auth-stage">
        <section class="auth-showcase">
            <div>
                <div class="panel-badge">Reference System</div>
                <h2>文献、实验与写作集中管理</h2>
                <p>登录后进入研究工作台，继续管理文献库、综述记录、实验设计和写作任务。</p>
            </div>

            <div class="auth-points">
                <div class="auth-point">
                    <strong>文献管理</strong>
                    <span>上传、解析、阅读、检索和引用整理集中处理。</span>
                </div>
                <div class="auth-point">
                    <strong>AI 研究辅助</strong>
                    <span>综述、实验设计、代码辅助和写作辅助统一入口。</span>
                </div>
                <div class="auth-point">
                    <strong>个人工作台</strong>
                    <span>保留个人资料、Token 使用和研究任务记录。</span>
                </div>
            </div>
        </section>

        <section class="auth-card">
            <div class="auth-header">
                <h1>登录研究工作台</h1>
                <p>可使用用户名或邮箱登录</p>
            </div>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login" class="auth-form">
                <div class="form-group">
                    <label for="identifier">用户名或邮箱</label>
                    <input type="text" id="identifier" name="identifier" required placeholder="请输入用户名或邮箱" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-primary">登录</button>
            </form>

            <div class="auth-footer">
                还没有账号？<a href="/register">立即注册</a>
            </div>
        </section>
    </div>
</body>
</html>
