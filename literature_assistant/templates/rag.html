{% extends "base.html" %}
{% block title %}RAG 检索 · Reference System{% endblock %}
{% block page_eyebrow %}RAG{% endblock %}
{% block page_title %}RAG 检索{% endblock %}
{% block content %}
<div class="workbench-main-grid codegen-workbench">
    <section class="control-panel glass-card">
        <div class="home-card-header">
            <div>
                <span class="panel-eyebrow">查询</span>
                <h3>检索知识片段</h3>
            </div>
        </div>

        <div class="form-group">
            <label for="rag-query">检索问题</label>
            <textarea id="rag-query" rows="5" placeholder="例如：无人机遥感小目标检测中的注意力模块改进思路"></textarea>
        </div>

        <div class="form-group">
            <label for="rag-topk">返回条数</label>
            <input id="rag-topk" type="number" min="1" max="20" value="5">
        </div>

        <button id="btn-rag-search" class="btn-primary">开始检索</button>
    </section>

    <section class="result-panel glass-card">
        <div class="home-card-header">
            <div>
                <span class="panel-eyebrow">结果</span>
                <h3>检索结果</h3>
            </div>
        </div>

        <div id="rag-results"></div>
    </section>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/rag.js?v=20260609a"></script>
{% endblock %}
