<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · Reference System</title>
    <link rel="stylesheet" href="/static/css/main.css?v=20260610d">
</head>
<body class="auth-page">
    <div class="auth-stage">
        <section class="auth-showcase">
            <div>
                <div class="panel-badge">Create Account</div>
                <h2>创建一个统一管理文献、实验与写作任务的研究账户。</h2>
                <p>注册后即可进入工作台，在同一界面中完成资料整理、方案规划与内容生成。</p>
            </div>

            <div class="auth-points">
                <div class="auth-point">
                    <strong>统一导航</strong>
                    <span>所有主要模块都已经纳入同一套视觉语言和交互框架。</span>
                </div>
                <div class="auth-point">
                    <strong>结果工作区</strong>
                    <span>输入与输出被重新拆分，页面不再像一堆简单表单。</span>
                </div>
                <div class="auth-point">
                    <strong>账户体系</strong>
                    <span>统一承载个人资料、资源额度与研究任务记录。</span>
                </div>
            </div>
        </section>

        <section class="auth-card">
            <div class="auth-header">
                <h1>创建账号</h1>
                <p>注册后可使用用户名或邮箱登录</p>
            </div>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/register" class="auth-form" id="register-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" required placeholder="请输入邮箱" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="至少 6 位字符" minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm_password">确认密码</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="再次输入密码" autocomplete="new-password">
                </div>
                <button type="submit" class="btn-primary">注册并进入系统</button>
            </form>

            <div class="auth-footer">
                已有账号？<a href="/login">返回登录</a>
            </div>
        </section>
    </div>

    <script src="/static/js/main.js?v=20260609f"></script>
    <script>
        document.getElementById("register-form").addEventListener("submit", async function (event) {
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirm_password").value;
            if (password !== confirmPassword) {
                event.preventDefault();
                await window.appAlert("两次输入的密码不一致");
            }
        });
    </script>
</body>
</html>
